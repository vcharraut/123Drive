defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# one dataset per run
command: convert  # convert | json_to_bin

dataset: waymo  # waymo | nuplan | openscenes

dataset_path: null

# openscenes only (optional)
openscenes:
  nuplan_logs_root: null
  nuplan_maps_root: null
  metadata_root: null

output_dir: "./output"

output:
  format: bin  # bin | json | both
  json_indent: null

json_to_bin:
  input_dir: null
  output_dir: null
  glob: "*.json"

# optional cap for quick smoke runs
max_scenarios: null

waymo:
  num_files: null

processors: []  # [validation, traffic_lights, polyline_interpolation, overpass_filtering]

validation:
  strict: false
  fail_on_error: false
  validation_level: 2
  speed_limit_tolerance: 0.12
  position_jump_threshold: 50.0
  velocity_tolerance: 2.0
  heading_tolerance_deg: 30.0

polyline_interpolation:
  max_segment_length: 2.0

overpass_filtering:
  xy_distance_threshold: 0.8
  z_difference_threshold: 4.0

pufferdrive:
  min_route_valid_points: 0
  route_check_timestep: 0
  polyline_reduction_threshold: 0.1
  dist_threshold: 10.0

num_workers: 8
batch_size: 10

hydra:
  output_subdir: null
  run:
    dir: .
