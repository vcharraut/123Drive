# Per-dataset reproducible presets for `convert`.
# Keys mirror convert's CLI args; explicit CLI flags override these values.
# A preset pins the dataset family only; pick a split with --split_names
# (e.g. --preset nuplan --split_names nuplan-mini_val for nuPlan mini).
# Usage:  uv run convert --preset <name> --py123d_path <data> --output <out>

[av2]
datasets = ["av2-sensor"]
duration_s = 15
invalid_agent_overlap = true

[carla]
datasets = ["carla"]
reverse_road_edges = true

[nuplan]
datasets = ["nuplan"]
reverse_road_edges = true
duration_s = 20
invalid_agent_overlap = true

[nuscenes]
datasets = ["nuscenes"]
reverse_road_edges = true
invalid_agent_overlap = true

[opendrive]
datasets = ["opendrive"]
reverse_road_edges = true

[wod-motion]
datasets = ["wod-motion"]
invalid_agent_overlap = true
