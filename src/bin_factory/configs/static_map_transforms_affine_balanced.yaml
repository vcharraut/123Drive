limit: 8
transforms:
  # Standard half: uniform mild scale; preserves shape while increasing all XY distances by 10%.
  - name: Sc10
    matrix:
      - [1.10, 0.0]
      - [0.0, 1.10]
  # Standard half: stretch global X only; tests horizontal spacing changes without changing global Y scale.
  - name: ScX10
    matrix:
      - [1.10, 0.0]
      - [0.0, 1.0]
  # Standard half: stretch global Y only; tests vertical spacing changes without changing global X scale.
  - name: ScY10
    matrix:
      - [1.0, 0.0]
      - [0.0, 1.10]
  # Standard half: positive X shear; shifts X position as a function of Y position.
  - name: ShXP
    matrix:
      - [1.0, 0.17]
      - [0.0, 1.0]
  # Standard half: negative X shear; opposite slant from ShXP for directional diversity.
  - name: ShXN
    matrix:
      - [1.0, -0.17]
      - [0.0, 1.0]
  # Standard half: positive Y shear; shifts Y position as a function of X position.
  - name: ShYP
    matrix:
      - [1.0, 0.0]
      - [0.17, 1.0]
  # Standard half: negative Y shear; opposite slant from ShYP for directional diversity.
  - name: ShYN
    matrix:
      - [1.0, 0.0]
      - [-0.17, 1.0]
  # FlipX half: mirror global X only; pairs with the original map for left/right reversal.
  - name: FlipX
    matrix:
      - [-1.0, 0.0]
      - [0.0, 1.0]
  # FlipX half: mirror global X after the uniform 10% scale.
  - name: FlipXSc10
    matrix:
      - [-1.10, 0.0]
      - [0.0, 1.10]
  # FlipX half: mirror global X after stretching global X only.
  - name: FlipXScX10
    matrix:
      - [-1.10, 0.0]
      - [0.0, 1.0]
  # FlipX half: mirror global X after stretching global Y only.
  - name: FlipXScY10
    matrix:
      - [-1.0, 0.0]
      - [0.0, 1.10]
  # FlipX half: mirror global X after positive X shear.
  - name: FlipXShXP
    matrix:
      - [-1.0, -0.17]
      - [0.0, 1.0]
  # FlipX half: mirror global X after negative X shear.
  - name: FlipXShXN
    matrix:
      - [-1.0, 0.17]
      - [0.0, 1.0]
  # FlipX half: mirror global X after positive Y shear.
  - name: FlipXShYP
    matrix:
      - [-1.0, 0.0]
      - [0.17, 1.0]
  # FlipX half: mirror global X after negative Y shear.
  - name: FlipXShYN
    matrix:
      - [-1.0, 0.0]
      - [-0.17, 1.0]
