[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "123Drive"
version = "0.1.0"
description = "Format data from 123d format to PufferDrive"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "joblib",
  "tqdm",
  "matplotlib",
  "hydra-core",
  "omegaconf",
  "py123d",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
convert = "src.main:cli_entry_point"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.uv.sources]
py123d = { git = "https://github.com/autonomousvision/py123d.git", branch = "dev_v0.0.9" }
