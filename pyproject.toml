[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "123Drive"
version = "0.1.0"
description = "Format data from 123d format to PufferDrive"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "joblib",
  "tqdm",
  "matplotlib",
  "py123d",
]

[project.optional-dependencies]
dev = ["ruff"]
viz = ["dash>=2.14", "plotly>=5.18", "dash-bootstrap-components>=1.5"]
all = ["ruff", "dash>=2.14", "plotly>=5.18", "dash-bootstrap-components>=1.5"]

[project.scripts]
convert = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "puffer_viz", "puffer_viz.*"]

[tool.uv.sources]
py123d = { git = "https://github.com/autonomousvision/py123d.git", branch = "main" }
