[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "123Drive"
version = "0.1.0"
description = "Convert raw AV datasets directly to PufferDrive format"
requires-python = "==3.10.*"
dependencies = [
  "numpy==1.23.4",
  "joblib",
  "tqdm",
  "hydra-core==1.1.1",
  "omegaconf>=2.1.0",
  "matplotlib>=3.10.8",
]

[project.optional-dependencies]
waymo = [
  "tensorflow==2.11.1",
  "protobuf<3.20",
]
nuplan = [
  "nuplan-devkit",
]
all = [
  "tensorflow==2.11.1",
  "protobuf<3.20",
  "nuplan-devkit",
  "ruff",
]

[project.scripts]
convert = "src.main:cli_entry_point"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.uv.sources]
nuplan-devkit = { path = "extern/nuplan-devkit", editable = true }

