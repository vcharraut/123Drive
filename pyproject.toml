[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "123Drive"
version = "0.1.0"
description = "Convert 123D datasets to PufferDrive binaries"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Valentin Charraut" },
]
keywords = ["autonomous-driving", "dataset-conversion", "pufferdrive", "123d"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "scipy",
  "joblib",
  "tqdm",
  "matplotlib",
  "py123d",
]

[project.optional-dependencies]
dev = ["ruff"]
viz = ["fastapi", "uvicorn[standard]", "orjson"]
all = ["ruff", "fastapi", "uvicorn[standard]", "orjson"]

[project.scripts]
convert = "bin_factory.main:main"
py123d-docker = "py123d_docker.cli:main"
web = "viz.server:main"
viz = "viz.plot:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["bin_factory", "bin_factory.*", "viz", "viz.*", "py123d_docker", "py123d_docker.*"]

[tool.setuptools.package-data]
viz = ["web/static/*"]

[project.urls]
Homepage = "https://github.com/vcharraut/123Drive"
Repository = "https://github.com/vcharraut/123Drive"
Issues = "https://github.com/vcharraut/123Drive/issues"

[tool.uv.sources]
py123d = { git = "https://github.com/autonomousvision/py123d", branch = "dev_v0.1.0" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "C90",  # mccabe
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PYI",  # flake8-pyi
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "NPY",  # numpy
    "RUF",  # ruff-specific rules
]

ignore = [
    "ISC001",  # Conflicts with the Ruff formatter
    "D100",    # Missing docstring in public module (often too strict)
    "D104",    # Missing docstring in public package
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pydocstyle]
convention = "google"  # Enforces a specific docstring style (can be "numpy" or "pep257")

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
