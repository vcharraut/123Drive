[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "123Drive"
version = "0.1.0"
description = "123D arrow files -> PufferDrive binaries"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Valentin Charraut" },
]
keywords = ["autonomous-driving", "dataset-conversion", "pufferdrive", "123d"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "tqdm",
  "joblib",
  "scipy",
  "shapely",
  "py123d==0.2.1",
]

[project.optional-dependencies]
viz = [
  "fastapi",
  "uvicorn[standard]",
]
dev = [
  "pytest",
  "ruff",
]
all = [
  "123Drive[viz,dev]",
]

[project.scripts]
convert = "bin_factory.main:main"
build = "docker_tools.cli:main"
web = "viz.server:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["bin_factory", "bin_factory.*", "viz", "viz.*", "docker_tools", "docker_tools.*"]

[tool.setuptools.package-data]
viz = ["web/static/*"]
docker_tools = ["dockerfiles/*", "*.py"]

[project.urls]
Homepage = "https://github.com/vcharraut/123Drive"
Repository = "https://github.com/vcharraut/123Drive"
Issues = "https://github.com/vcharraut/123Drive/issues"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "C90",  # mccabe
    "I",    # isort
    "N",    # pep8-naming
    # "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PYI",  # flake8-pyi
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "NPY",  # numpy
    "RUF",  # ruff-specific rules
]

ignore = [
    "ISC001",  # Conflicts with the Ruff formatter
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["src"]
